<header class="topbar">
  <label class="topbar__search">
    <span aria-hidden="true">⌕</span>
    <input type="search" placeholder="Search..." aria-label="Search" />
  </label>

  <div class="topbar__actions">
    <span class="demo-badge" title="This is a self-contained demo. All data lives in your browser only.">● Demo Mode</span>
    <span aria-hidden="true">🔔</span>
    <div class="topbar__user">
      <span class="sidebar__avatar" style="background:var(--indigo-accent-soft); color:var(--indigo-accent);">AT</span>
      <span>Alex Thompson</span>
    </div>
    <button class="topbar__logout" id="reset-demo-btn" type="button" title="Clear your changes and restore the original demo data">Reset Demo Data</button>
  </div>
</header>
